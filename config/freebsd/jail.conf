# HAL-OS Multi-Agent No-IP Jail Configuration (/etc/jail.conf)

exec.clean;
mount.devfs;
devfs_ruleset = 4;
enforce_statfs = 2;

# Disable all IP stacks and raw sockets inside cognitive/worker Jails
ip4 = disable;
ip6 = disable;
allow.raw_sockets = 0;
allow.mount = 0;

# Persist thin jails cleanly; per-agent configs may override exec.start
exec.prepare = "mkdir -p /var/run/hal/jails/$name";
persist;
exec.start = "";
exec.stop = "";

path = "/pool/jails/agents/$name/root";
mount.fstab = "/pool/jails/agents/$name/fstab";

.include "/etc/jail.conf.d/*.conf";
