# HAL-OS OOB SSH daemon binding (/etc/ssh/sshd_config.d/hal-oob.conf)
# Bind SSH strictly to the out-of-band management interface (mgmt0), never wan0.
ListenAddress 192.168.100.10
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
AllowTcpForwarding local
