# HAL-OS Phase 0 kernel & boot loader settings (/boot/loader.conf)
# NOTE: kern.racct.enable="1" requires a reboot to activate RCTL limits.
kern.racct.enable="1"
zfs_load="YES"
pf_load="YES"
pflog_load="YES"
nullfs_load="YES"

# Serial + video console for clean QEMU -nographic operation
boot_multicons="YES"
boot_serial="YES"
comconsole_speed="115200"
console="comconsole,vidconsole"
