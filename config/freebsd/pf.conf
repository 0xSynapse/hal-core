# HAL Core Zero-Trust Packet Filter Rules (/etc/pf.conf)

mgmt_if     = "mgmt0"
wan_if      = "wan0"
wg_agent_if = "wg0"
wg_oob_if   = "wg1"

# Allow loopback on host; No-IP Jails have no IP stack at all
set skip on lo0
set block-policy drop

# Normalize incoming traffic
scrub in all

# ------------------------------------------------------------------
# Default-Deny all traffic and log drops for adapter-netmon
# ------------------------------------------------------------------
block log all

# 1. Out-of-Band Human Control Plane (mgmt0 + wg-oob WireGuard 10.100.0.0/24)
pass in quick on $mgmt_if proto tcp from 192.168.100.0/24 to ($mgmt_if) port { 22, 8443 } keep state
pass out quick on $mgmt_if to 192.168.100.0/24 keep state
pass in quick on $wg_oob_if proto tcp from 10.100.0.0/24 to ($wg_oob_if) port { 22, 8443 } keep state
pass out quick on $wg_oob_if to 10.100.0.0/24 keep state

# 2. Allow host DHCP lease renewal on wan0 (UDP 68 -> 67)
pass out quick on $wan_if inet proto udp from any port 68 to any port 67 keep state

# 3. Temporary human maintenance anchor (toggled via hal-maint-net on/off)
anchor "hal_maint"

# 4. Remote agent ingress via wg-agent WireGuard (10.99.0.0/24 -> hal-gateway port 9443 ONLY)
pass in quick on $wg_agent_if proto tcp from 10.99.0.0/24 to ($wg_agent_if) port 9443 keep state
pass out quick on $wg_agent_if proto tcp from ($wg_agent_if) port 9443 to 10.99.0.0/24 keep state
anchor "hal_gateway"
anchor "hal_wireguard"

# 5. Business Egress (wan0): strictly allow ONLY _hal_broker outbound
pass out log quick on $wan_if proto tcp user _hal_broker keep state
pass out log quick on $wan_if proto udp to port { 443, 853 } user _hal_broker keep state

# Explicitly block & log all other outbound attempts (including raw DNS 53)
block out log quick on $wan_if all
