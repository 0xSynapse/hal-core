[workspace]
resolver = "2"
members = [
    "crates/hal-proto",
    "crates/hal-os-hal",
    "crates/hal-audit",
    "crates/hal-policy",
    "crates/hal-bus",
    "crates/hal-net-broker",
    "crates/hal-workspace",
    "crates/hal-sandbox",
    "crates/hal-gateway",
    "crates/hal-bridge",
    "crates/hal-oob",
    "crates/hal-watchdog",
    "crates/hal-adapters/adapter-netmon",
    "crates/hal-adapters/adapter-sim-ship",
    "crates/hal-adapters/adapter-vault",
    "crates/hal-adapters/adapter-work",
    "crates/hal-adapters/adapter-digest",
    "crates/hal-brain",
    "tests/redteam",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
toml = "0.8"
libc = "0.2"
hal-proto = { path = "crates/hal-proto" }
hal-os-hal = { path = "crates/hal-os-hal" }
hal-audit = { path = "crates/hal-audit" }
hal-policy = { path = "crates/hal-policy" }
hal-bus = { path = "crates/hal-bus" }
hal-net-broker = { path = "crates/hal-net-broker" }
hal-workspace = { path = "crates/hal-workspace" }
hal-sandbox = { path = "crates/hal-sandbox" }
hal-gateway = { path = "crates/hal-gateway" }
hal-bridge = { path = "crates/hal-bridge" }
hal-oob = { path = "crates/hal-oob" }
hal-watchdog = { path = "crates/hal-watchdog" }
adapter-netmon = { path = "crates/hal-adapters/adapter-netmon" }
adapter-sim-ship = { path = "crates/hal-adapters/adapter-sim-ship" }
adapter-vault = { path = "crates/hal-adapters/adapter-vault" }
adapter-work = { path = "crates/hal-adapters/adapter-work" }
adapter-digest = { path = "crates/hal-adapters/adapter-digest" }
hal-brain = { path = "crates/hal-brain" }
