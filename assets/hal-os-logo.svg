<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="HAL-OS Logo">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#151B24" />
      <stop offset="100%" stop-color="#0D1117" />
    </radialGradient>

    <linearGradient id="bezelOuter" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#6B7686" />
      <stop offset="32%" stop-color="#3A4350" />
      <stop offset="68%" stop-color="#222832" />
      <stop offset="100%" stop-color="#4B5564" />
    </linearGradient>

    <linearGradient id="ringMid" x1="20%" y1="12%" x2="80%" y2="88%">
      <stop offset="0%" stop-color="#586373" />
      <stop offset="45%" stop-color="#2D3542" />
      <stop offset="100%" stop-color="#434D5B" />
    </linearGradient>

    <linearGradient id="ringInner" x1="18%" y1="15%" x2="82%" y2="85%">
      <stop offset="0%" stop-color="#4C5665" />
      <stop offset="50%" stop-color="#232A34" />
      <stop offset="100%" stop-color="#3B4452" />
    </linearGradient>

    <radialGradient id="lensDepth" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#181C24" />
      <stop offset="55%" stop-color="#0A0D12" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>

    <radialGradient id="lensAmbientRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2438" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#C91428" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FF2438" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="crimsonRing" x1="25%" y1="15%" x2="75%" y2="85%">
      <stop offset="0%" stop-color="#FF5A68" />
      <stop offset="50%" stop-color="#F01E36" />
      <stop offset="100%" stop-color="#FF3347" />
    </linearGradient>

    <radialGradient id="amberCore" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF2CC" />
      <stop offset="45%" stop-color="#F7B348" />
      <stop offset="100%" stop-color="#D97718" />
    </radialGradient>

    <linearGradient id="glassSheen" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24" />
      <stop offset="65%" stop-color="#D8E2F0" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="crimsonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="amberGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded-square obsidian badge (clean on both GitHub Dark & Light themes) -->
  <rect x="0" y="0" width="512" height="512" rx="88" ry="88" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="86.5" ry="86.5" fill="none" stroke="#262E3A" stroke-width="2" />

  <!-- Layer 0: Outer Machined Titanium Bezel (Spinal Cord) -->
  <circle cx="256" cy="256" r="212" fill="url(#bezelOuter)" />
  <circle cx="256" cy="256" r="211" fill="none" stroke="#8A96A8" stroke-opacity="0.35" stroke-width="1.5" />
  <circle cx="256" cy="256" r="196" fill="#090C11" />

  <!-- Outer Bezel Side Slots -->
  <path d="M 62.9 318.7 A 203 203 0 0 1 62.9 193.3" fill="none" stroke="#141922" stroke-width="6" stroke-linecap="round" />
  <path d="M 449.1 193.3 A 203 203 0 0 1 449.1 318.7" fill="none" stroke="#141922" stroke-width="6" stroke-linecap="round" />

  <!-- Layer 1: Middle Capability Ring (Brainstem) -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#ringMid)" stroke-width="22" />
  <circle cx="256" cy="256" r="186" fill="none" stroke="#7A8699" stroke-opacity="0.45" stroke-width="1.5" />
  <circle cx="256" cy="256" r="164" fill="none" stroke="#080B10" stroke-width="2" />

  <!-- 12 Precision Capability Ticks (30-degree intervals) -->
  <g stroke="#0D1117" stroke-linecap="round">
    <line x1="256" y1="77" x2="256" y2="92" stroke-width="3.6" transform="rotate(0 256 256)" />
    <line x1="256" y1="81" x2="256" y2="92" stroke-width="2.6" transform="rotate(30 256 256)" />
    <line x1="256" y1="81" x2="256" y2="92" stroke-width="2.6" transform="rotate(60 256 256)" />
    <line x1="256" y1="77" x2="256" y2="92" stroke-width="3.6" transform="rotate(90 256 256)" />
    <line x1="256" y1="81" x2="256" y2="92" stroke-width="2.6" transform="rotate(120 256 256)" />
    <line x1="256" y1="81" x2="256" y2="92" stroke-width="2.6" transform="rotate(150 256 256)" />
    <line x1="256" y1="77" x2="256" y2="92" stroke-width="3.6" transform="rotate(180 256 256)" />
    <line x1="256" y1="81" x2="256" y2="92" stroke-width="2.6" transform="rotate(210 256 256)" />
    <line x1="256" y1="81" x2="256" y2="92" stroke-width="2.6" transform="rotate(240 256 256)" />
    <line x1="256" y1="77" x2="256" y2="92" stroke-width="3.6" transform="rotate(270 256 256)" />
    <line x1="256" y1="81" x2="256" y2="92" stroke-width="2.6" transform="rotate(300 256 256)" />
    <line x1="256" y1="81" x2="256" y2="92" stroke-width="2.6" transform="rotate(330 256 256)" />
  </g>

  <!-- Isolation Trench -->
  <circle cx="256" cy="256" r="154" fill="#070A0E" />

  <!-- Layer 2: Inner Sandbox / No-IP Jail Boundary Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ringInner)" stroke-width="20" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#6E7A8C" stroke-opacity="0.4" stroke-width="1.2" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#0A0D12" stroke-width="2" />

  <!-- 8 Inner Capability Notches (45-degree intervals) -->
  <g stroke="#0C1016" stroke-width="2.4" stroke-linecap="round">
    <line x1="256" y1="117" x2="256" y2="126" transform="rotate(22.5 256 256)" />
    <line x1="256" y1="117" x2="256" y2="126" transform="rotate(67.5 256 256)" />
    <line x1="256" y1="117" x2="256" y2="126" transform="rotate(112.5 256 256)" />
    <line x1="256" y1="117" x2="256" y2="126" transform="rotate(157.5 256 256)" />
    <line x1="256" y1="117" x2="256" y2="126" transform="rotate(202.5 256 256)" />
    <line x1="256" y1="117" x2="256" y2="126" transform="rotate(247.5 256 256)" />
    <line x1="256" y1="117" x2="256" y2="126" transform="rotate(292.5 256 256)" />
    <line x1="256" y1="117" x2="256" y2="126" transform="rotate(337.5 256 256)" />
  </g>

  <!-- Lens Housing Collar -->
  <circle cx="256" cy="256" r="118" fill="#06080C" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#2D3542" stroke-width="6" />
  <circle cx="256" cy="256" r="113" fill="none" stroke="#6B7687" stroke-opacity="0.35" stroke-width="1" />

  <!-- Layer 3: HAL Optical Lens & Unprivileged Cognitive Core -->
  <circle cx="256" cy="256" r="102" fill="url(#lensDepth)" />
  <circle cx="256" cy="256" r="88" fill="url(#lensAmbientRed)" />

  <!-- Optical Top Dome Sheen -->
  <ellipse cx="256" cy="202" rx="46" ry="26" fill="url(#glassSheen)" />

  <!-- Luminous Crimson Inner Ring -->
  <circle cx="256" cy="256" r="46" fill="none" stroke="#FF1F38" stroke-width="13" opacity="0.55" filter="url(#crimsonGlow)" />
  <circle cx="256" cy="256" r="46" fill="none" stroke="url(#crimsonRing)" stroke-width="11" />

  <!-- Warm Amber-Gold Pinpoint Core -->
  <circle cx="256" cy="256" r="10" fill="#FF9F1C" opacity="0.55" filter="url(#amberGlow)" />
  <circle cx="256" cy="256" r="7.5" fill="url(#amberCore)" />

  <!-- Crisp Specular Optical Glass Arcs -->
  <path d="M 172.9 233.7 A 86 86 0 0 1 278.3 172.9" fill="none" stroke="#E6EDF3" stroke-opacity="0.82" stroke-width="3.2" stroke-linecap="round" />
  <path d="M 337.8 282.6 A 86 86 0 0 1 244.0 341.2" fill="none" stroke="#CBD5E1" stroke-opacity="0.52" stroke-width="2.5" stroke-linecap="round" />
</svg>
